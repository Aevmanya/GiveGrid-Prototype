<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request Added | GiveGrid</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--accent:#2563eb;--soft:#eff6ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#f4f7fb);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.org-topbar{background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000;backdrop-filter:blur(12px)}
.org-topbar-inner{max-width:1240px;min-height:72px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.org-brand{color:var(--ink);text-decoration:none;font-size:25px;font-weight:800;letter-spacing:-.6px}.org-mark{display:inline-flex;width:34px;height:34px;margin-right:8px;border-radius:10px;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);font-weight:800}
.org-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.org-nav a{color:#475467;text-decoration:none;font-size:14px;font-weight:650;padding:9px 12px;border-radius:9px}.org-nav a:hover{background:#f2f4f7;color:var(--ink)}.org-nav .account{border:1px solid #bfdbfe;color:var(--accent);background:#fff}
.shell{max-width:760px;margin:auto;padding:72px 24px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:48px;text-align:center;box-shadow:0 8px 30px #1018280a}.icon{width:64px;height:64px;margin:0 auto 22px;border-radius:20px;background:#ecfdf3;color:#15803d;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:40px;letter-spacing:-1.4px}p{color:var(--muted);line-height:1.65;margin:14px auto 30px;max-width:520px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.primary,.secondary,.light{padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:750}.primary{background:var(--accent);color:#fff}.secondary{border:1px solid #bfdbfe;background:#fff;color:var(--accent)}.light{background:#f2f4f7;color:#475467}@media(max-width:760px){.org-topbar-inner{padding:14px 18px;align-items:flex-start}.org-nav a{padding:8px 9px}.org-brand{font-size:22px}.shell{padding:42px 16px}.card{padding:34px 22px}h1{font-size:34px}}
</style>
<link rel="stylesheet" th:href="@{/css/givegrid-theme.css}">
</head>
<body>
<header class="org-topbar"><div class="org-topbar-inner">
<a class="org-brand" href="/seller/dashboard"><span class="org-mark">G</span>GiveGrid</a>
<nav class="org-nav" aria-label="Organisation navigation">
<a href="/seller/dashboard">Dashboard</a><a href="/products">My Requests</a><a href="/seller/requests">Donation Requests</a><a class="account" href="/profile">Account</a>
</nav></div></header>
<main class="shell"><section class="card">
<div class="icon">✓</div><p class="eyebrow">Organisation workspace</p><h1>Request added successfully</h1>
<p>Your new community request has been saved and is now ready for donors to discover.</p>
<div class="actions"><a class="primary" href="/products">View Requests</a><a class="secondary" href="/products/add">Add Another Request</a><a class="light" href="/seller/dashboard">Return to Dashboard</a></div>
</section></main>
</body></html>
