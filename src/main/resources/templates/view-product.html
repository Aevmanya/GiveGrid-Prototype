<!DOCTYPE htmlP
<html lang="en" xmlns:th="http://www.thymeleaf.org"P
<headP
    <meta charset="UTF-8"P
    <titlePRequest Details</titleP
    <link rel="stylesheet" th:href="@{/style.css}"P
    <styleP
        /* --- Inline fallback styles (use your real style.css if you have one) --- */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
            text-align: left;
        }

        .details-container {
            display: flex;
            justify-content: space-between;
            padding: 50px;
            gap: 40px;
        }

        .info-box {
            width: 30%;
            background: white;
            padding: 30px;
            border: 2px solid black;
            font-size: 17px;
            line-height: 1.6;
            border-radius: 16px;
            height: 450px;
        }

        .image-box {
            width: 95%;
            background: #fafafa;
            border: 2px dashed #aaa;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #777;
            height: 500px;
        }

        h1 {
            text-align: center;
            margin-top: 40px;
            font-size: 42px;
        }

        .buttons-row {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 80px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-back {
            display: flex;
            justify-content: center;
            background: #4d78ff;
            color: white;
            width:400px;
        }

        .btn-cart {
            display: flex;
            justify-content: center;
            background: #ff4d4d;
            color: white;
            width:500px;
        }


    </styleP
</headP

<bodyP

<h1 th:text="${product.name}"PProduct Name</h1P

<div class="details-container"P

    <!-- LEFT INFO PANEL --P
    <div class="info-box"P
        <pP<strongPQuantity required:</strongP <span th:text="${product.quantity}"P</spanP</pP
        <pP<strongPCondition:</strongP <span th:text="${product.condition}"P</spanP</pP
        <pP<strongPDescription:</strongP</pP
        <p th:text="${product.description}"P</pP

        <brP<brP

        <pP<strongPInformation about the organisation:</strongP</pP
        <pP(You can add more info here if needed.)</pP
    </divP

    <!-- RIGHT IMAGE PANEL --P
    <div class="image-box"P
        <spanPNo image uploaded yet</spanP
        <!-- If you later add image support, replace with: --P
        <!-- <img th:src="@{${product.imageUrl}}" alt="Product Image"P --P
    </divP

</divP


<!-- BUTTONS --P
<div class="buttons-row"P

    <!-- Back button --P
    <a href="javascript:history.back()" class="btn btn-back"PBack</aP

    <!-- Add to Donation Basket button for BUYER --P
    <form th:if="${user != null and user.role == 'BUYER'}"
          th:action="@{/cart/add/{id}(id=${product.id})}"
          method="post"P
        <button class="btn btn-cart"PAdd to Donation Basket</buttonP
    </formP

    <!-- Edit Request button for SELLER --P
    <a th:if="${user != null and user.role == 'SELLER'}"
       th:href="@{/products/edit/{id}(id=${product.id})}"
       class="btn btn-cart"PEdit Request</aP
</divP

</bodyP
</htmlP
