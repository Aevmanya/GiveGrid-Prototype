<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Requests | GiveGrid"><style>
:root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#f4f7fb);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:1160px;margin:auto;padding:46px 24px 64px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}h1{font-size:40px;letter-spacing:-1.4px;margin:0}.intro{color:var(--muted);margin:12px 0 0}.primary{background:var(--accent);color:#fff;text-decoration:none;padding:11px 16px;border-radius:10px;font-weight:750}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #1018280a}.empty{text-align:center;padding:52px 24px}.empty p{color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:760px}th{padding:15px 18px;text-align:left;background:#f8fafc;color:#667085;font-size:12px;text-transform:uppercase}td{padding:16px 18px;border-top:1px solid #eef1f5;font-size:14px}.wrap{overflow:auto}.request{font-weight:750}.pill{padding:6px 9px;border-radius:999px;background:#f2f4f7;font-size:12px;font-weight:700}.actions{display:flex;gap:7px}.action{padding:8px 10px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:750}.view{background:#eff6ff;color:#2563eb}.edit{background:#f2f4f7;color:#475467}.delete{background:#fef3f2;color:#b42318}@media(max-width:760px){.shell{padding:34px 16px}.head{display:block}h1{font-size:34px}.primary{display:inline-block;margin-top:18px}}
</style></head><body><div th:replace="~{seller-nav :: seller-nav}"></div><main class="shell"><div class="head"><div><p class="eyebrow">Organisation workspace</p><h1>My requests</h1><p class="intro">Manage the community requests your organisation has published.</p></div><a class="primary" href="/products/add">+ Create Request</a></div><section class="panel"><div class="empty" th:if="${#lists.isEmpty(products)}"><h2>No requests yet</h2><p>Create your first request to start receiving support from donors.</p><a class="primary" href="/products/add">Create a Request</a></div><div class="wrap" th:if="${!#lists.isEmpty(products)}"><table><thead><tr><th>#</th><th>Request</th><th>Quantity</th><th>Condition</th><th>Actions</th></tr></thead><tbody><tr th:each="product,iter : ${products}"><td th:text="${iter.count}">1</td><td class="request request-title-case" th:text="${product.name}">Request</td><td><span class="pill" th:text="${product.quantity + ' items'}">1 items</span></td><td th:text="${product.condition}">New</td><td><div class="actions"><a class="action view" th:href="@{/products/{id}(id=${product.id})}">View</a><a class="action edit" th:href="@{/products/edit/{id}(id=${product.id})}">Edit</a><a class="action delete" th:href="@{'/products/delete/' + ${product.id}}" onclick="return confirm('Delete this request?')">Delete</a></div></td></tr></tbody></table></div></section></main><script>document.querySelectorAll(".request-title-case").forEach(e=>e.textContent=e.textContent.toLowerCase().replace(/\b\w/g,l=>l.toUpperCase()));</script></body></html>
