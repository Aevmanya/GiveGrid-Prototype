<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Requests | GiveGrid"><style>
:root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--accent:#2563eb;--success:#15803d;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#f4f7fb);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1160px;margin:auto;padding:46px 24px 64px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}h1{font-size:40px;letter-spacing:-1.4px;margin:0}.intro{color:var(--muted);line-height:1.6;margin:12px 0 28px}.head{display:flex;justify-content:space-between;align-items:end}.back{padding:10px 14px;border:1px solid #d0d5dd;border-radius:10px;color:#475467;text-decoration:none;font-weight:700;background:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #1018280a}.empty{text-align:center;padding:52px 24px}.empty h2{margin:0 0 8px}.empty p{color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;min-width:820px;border-collapse:collapse}th{padding:15px 18px;text-align:left;background:#f8fafc;color:#667085;font-size:12px;text-transform:uppercase;letter-spacing:.06em}td{padding:17px 18px;border-top:1px solid #eef1f5;font-size:14px}.request{font-weight:750}.pill{padding:6px 9px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:12px;font-weight:700}.actions{display:flex;gap:7px}button{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.approve{background:#ecfdf3;color:var(--success)}.reject{background:#fef3f2;color:var(--danger)}form{margin:0}@media(max-width:760px){.shell{padding:34px 16px 50px}.head{display:block}h1{font-size:34px}.back{display:inline-block;margin-bottom:20px}}
</style></head><body><style>.org-topbar{background:rgba(255,255,255,.97);border-bottom:1px solid #e6e9ef;position:sticky;top:0;z-index:1000;backdrop-filter:blur(12px)}.org-topbar-inner{max-width:1240px;min-height:72px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.org-brand{color:#172033;text-decoration:none;font-size:25px;font-weight:800;letter-spacing:-.6px}.org-mark{display:inline-flex;width:34px;height:34px;margin-right:8px;border-radius:10px;align-items:center;justify-content:center;background:#eff6ff;color:#2563eb;font-weight:800}.org-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.org-nav a{color:#475467;text-decoration:none;font-size:14px;font-weight:650;padding:9px 12px;border-radius:9px}.org-nav a:hover{background:#f2f4f7;color:#172033}.org-nav .account{border:1px solid #bfdbfe;color:#2563eb;background:#fff}@media(max-width:760px){.org-topbar-inner{padding:12px 16px;align-items:flex-start}.org-nav a{padding:8px 9px}.org-brand{font-size:22px}}</style><header class="org-topbar"><div class="org-topbar-inner"><a class="org-brand" href="/seller/dashboard"><span class="org-mark">G</span>GiveGrid</a><nav class="org-nav" aria-label="Organisation navigation"><a href="/seller/dashboard">Dashboard</a><a href="/products">My Requests</a><a href="/seller/requests">Donation Requests</a><a href="/seller/donation/history">Donation History</a><a class="account" href="/profile">Account</a></nav></div></header><main class="shell"><div class="head"><div><p class="eyebrow">Organisation workspace</p><h1>Donation requests</h1><p class="intro">Review donor submissions for your published community requests.</p></div><a class="back" href="/seller/dashboard">← Dashboard</a></div><section class="panel"><div class="empty" th:if="${#lists.isEmpty(requests)}"><h2>No pending requests</h2><p>New donor submissions will appear here when they arrive.</p></div><div class="table-wrap" th:if="${!#lists.isEmpty(requests)}"><table><thead><tr><th>Donor</th><th>Request</th><th>Quantity</th><th>Condition</th><th>Submitted</th><th>Actions</th></tr></thead><tbody><tr th:each="r : ${requests}"><td th:text="${r.buyer.fullName != null and !#strings.isEmpty(r.buyer.fullName) ? r.buyer.fullName : r.buyer.username}">Donor</td><td class="request request-title-case" th:text="${r.product.name}">Request</td><td><span class="pill" th:text="${r.quantity + ' items'}">1 items</span></td><td th:text="${r.condition}">New</td><td th:text="${#temporals.format(r.submittedAt,'dd MMM yyyy, HH:mm')}">—</td><td><div class="actions"><form th:action="@{'/seller/requests/approve/' + ${r.id}}" method="post"><button class="approve">Approve</button></form><form th:action="@{'/seller/requests/reject/' + ${r.id}}" method="post"><button class="reject">Reject</button></form></div></td></tr></tbody></table></div></section></main></body></html>
