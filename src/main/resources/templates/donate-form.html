<div th:replace="~{donor-nav :: donor-nav}"></div>
<!DOCTYPE htmlP
<html xmlns:th="http://www.thymeleaf.org"P
<headP
    <titlePDonation Form</titleP
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"P
</headP
<bodyP
<div class="container mt-5"P
    <h2PDonation Details</h2P
    <hrP

    <form action="/donate/submit" method="post" id="donationForm"P
        <input type="hidden" name="itemId" th:value="${item.id}" /P

        <!-- Top card --P
        <div class="card p-3 mb-3"P
            <div class="row align-items-center"P
                <div class="col-md-6"P
                    <h5 th:text="${item.product.name}"PProduct</h5P
                    <pP
                        <strongPQuantity required:</strongP
                        <span th:text="${item.product.quantity}"P0</spanP

                        &nbsp;|&nbsp;
                        <smallPIn donation basket:
                            <span th:text="${item.quantity}"P0</spanP
                        </smallP
                    </pP
                </divP

                <div class="col-md-6"P
                    <labelPHow many units do you want to donate?</labelP

                    <!-- ✔ FIXED: correct max based on cart quantity --P
                    <input id="donateCount"
                           type="number"
                           name="donateCount"
                           class="form-control"
                           min="1"
                           th:attr="max=${item.quantity}"
                           value="1"/P


                    <!-- ✔ FIXED: display correct max --P
                    <small class="text-muted"P
                        Max: <span th:text="${item.quantity}"P0</spanP
                    </smallP
                </divP
            </divP
        </divP

        <!-- Dynamic per-unit boxes --P
        <div id="unitBoxes"P</divP

        <button type="submit" class="btn btn-success mt-3"PSubmit Donation</buttonP
    </formP
</divP

<scriptP
    const donateCountInput = document.getElementById('donateCount');
    const unitBoxes = document.getElementById('unitBoxes');

    // ✔ correct max read
    let maxAllowed = parseInt(donateCountInput.max);

    function renderBoxes() {
        unitBoxes.innerHTML = '';
        let count = parseInt(donateCountInput.value || '1');

        if (count < 1) count = 1;
        if (count P maxAllowed) count = maxAllowed;

        donateCountInput.value = count;

        for (let i = 0; i < count; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card p-3 mb-2';
            wrapper.innerHTML = `
                <div class="row"P
                    <div class="col-md-8"P
                        <strongP${document.querySelector('h5').innerText}</strongP
                        <pPUnit #${i + 1}</pP
                    </divP
                    <div class="col-md-4"P
                        <labelPCondition</labelP

                        <!-- ✔ FIXED: Spring array binding --P
                        <select name="condition[]" class="form-control" requiredP
                            <option value="New" selectedPNew</optionP
                            <option value="Used"PUsed</optionP
                            <option value="Slightly Used"PSlightly Used</optionP
                        </selectP
                    </divP
                </divP
            `;
            unitBoxes.appendChild(wrapper);
        }
    }

    donateCountInput.addEventListener('input', () =P renderBoxes());

    renderBoxes();
</scriptP
</bodyP
</htmlP
