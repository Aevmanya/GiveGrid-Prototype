<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation History | GiveGrid"><style>
:root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#f4f7fb);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:1160px;margin:auto;padding:46px 24px 64px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:40px;letter-spacing:-1.4px;margin:0}.intro{color:var(--muted);margin:12px 0 28px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #1018280a}.empty{text-align:center;padding:52px 24px}.empty p{color:var(--muted)}.wrap{overflow:auto}table{width:100%;min-width:720px;border-collapse:collapse}th{padding:15px 18px;text-align:left;background:#f8fafc;color:#667085;font-size:12px;text-transform:uppercase}td{padding:17px 18px;border-top:1px solid #eef1f5;font-size:14px}.request{font-weight:750}.pill{padding:6px 9px;border-radius:999px;background:#ecfdf3;color:#15803d;font-size:12px;font-weight:750}@media(max-width:760px){.shell{padding:34px 16px}h1{font-size:34px}}
</style></head><body><style>.org-topbar{background:rgba(255,255,255,.97);border-bottom:1px solid #e6e9ef;position:sticky;top:0;z-index:1000;backdrop-filter:blur(12px)}.org-topbar-inner{max-width:1240px;min-height:72px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.org-brand{color:#172033;text-decoration:none;font-size:25px;font-weight:800;letter-spacing:-.6px}.org-mark{display:inline-flex;width:34px;height:34px;margin-right:8px;border-radius:10px;align-items:center;justify-content:center;background:#eff6ff;color:#2563eb;font-weight:800}.org-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.org-nav a{color:#475467;text-decoration:none;font-size:14px;font-weight:650;padding:9px 12px;border-radius:9px}.org-nav a:hover{background:#f2f4f7;color:#172033}.org-nav .account{border:1px solid #bfdbfe;color:#2563eb;background:#fff}@media(max-width:760px){.org-topbar-inner{padding:12px 16px;align-items:flex-start}.org-nav a{padding:8px 9px}.org-brand{font-size:22px}}</style><header class="org-topbar"><div class="org-topbar-inner"><a class="org-brand" href="/seller/dashboard"><span class="org-mark">G</span>GiveGrid</a><nav class="org-nav" aria-label="Organisation navigation"><a href="/seller/dashboard">Dashboard</a><a href="/products">My Requests</a><a href="/seller/requests">Donation Requests</a><a href="/seller/donation/history">Donation History</a><a class="account" href="/profile">Account</a></nav></div></header><main class="shell"><p class="eyebrow">Organisation workspace</p><h1>Donation history</h1><p class="intro">A record of donations your organisation has accepted.</p><section class="panel"><div class="empty" th:if="${historyList == null or #lists.isEmpty(historyList)}"><h2>No accepted donations yet</h2><p>Accepted donor submissions will appear here.</p></div><div class="wrap" th:if="${historyList != null and !#lists.isEmpty(historyList)}"><table><thead><tr><th>Donor</th><th>Request</th><th>Quantity</th><th>Condition</th><th>Accepted on</th></tr></thead><tbody><tr th:each="req : ${historyList}"><td th:text="${req.buyer.fullName != null and !#strings.isEmpty(req.buyer.fullName) ? req.buyer.fullName : req.buyer.username}">Donor</td><td class="request request-title-case" th:text="${req.product.name}">Request</td><td><span class="pill" th:text="${req.quantity + ' items'}">1 items</span></td><td th:text="${req.condition}">New</td><td th:text="${req.approvedAt != null ? req.approvedAt : '—'}">—</td></tr></tbody></table></div></section></main><script>document.querySelectorAll(".request-title-case").forEach(e=>e.textContent=e.textContent.toLowerCase().replace(/\b\w/g,l=>l.toUpperCase()));</script></body></html>
