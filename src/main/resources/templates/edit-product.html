<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Request | GiveGrid"><style>
:root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#f4f7fb);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:900px;margin:auto;padding:46px 24px 64px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}h1{font-size:40px;letter-spacing:-1.4px;margin:0}.intro{color:var(--muted);margin:12px 0 28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 5px 18px #1018280a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:11px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:140px;resize:vertical}.actions{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:22px}.primary,.secondary{padding:11px 16px;border-radius:10px;font:inherit;font-weight:750;text-decoration:none}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid #d0d5dd;color:#475467;background:#fff}@media(max-width:700px){.shell{padding:34px 16px}.grid{grid-template-columns:1fr}h1{font-size:34px}.card{padding:22px}}
</style></head><body><style>.org-topbar{background:rgba(255,255,255,.97);border-bottom:1px solid #e6e9ef;position:sticky;top:0;z-index:1000;backdrop-filter:blur(12px)}.org-topbar-inner{max-width:1240px;min-height:72px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.org-brand{color:#172033;text-decoration:none;font-size:25px;font-weight:800;letter-spacing:-.6px}.org-mark{display:inline-flex;width:34px;height:34px;margin-right:8px;border-radius:10px;align-items:center;justify-content:center;background:#eff6ff;color:#2563eb;font-weight:800}.org-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.org-nav a{color:#475467;text-decoration:none;font-size:14px;font-weight:650;padding:9px 12px;border-radius:9px}.org-nav a:hover{background:#f2f4f7;color:#172033}.org-nav .account{border:1px solid #bfdbfe;color:#2563eb;background:#fff}@media(max-width:760px){.org-topbar-inner{padding:14px 18px;align-items:flex-start}.org-nav a{padding:8px 9px}.org-brand{font-size:22px}}</style><header class="org-topbar"><div class="org-topbar-inner"><a class="org-brand" href="/seller/dashboard"><span class="org-mark">G</span>GiveGrid</a><nav class="org-nav" aria-label="Organisation navigation"><a href="/seller/dashboard">Dashboard</a><a href="/products">My Requests</a><a href="/seller/requests">Donation Requests</a><a href="/seller/donation/history">Donation History</a><a class="account" href="/profile">Account</a></nav></div></header><main class="shell"><p class="eyebrow">Organisation workspace</p><h1>Edit request</h1><p class="intro">Update the details donors see when they discover this community request.</p><form class="card" th:action="@{/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post"><div class="grid"><div class="field"><label for="name">Request name</label><input id="name" type="text" th:field="*{name}" required></div><div class="field"><label for="quantity">Quantity required</label><input id="quantity" type="number" th:field="*{quantity}" min="1" required></div><div class="field"><label for="condition">Request condition</label><select id="condition" name="condition" required><option value="New" th:selected="${product.condition == 'New'}">New</option><option value="Used" th:selected="${product.condition == 'Used'}">Used</option><option value="Any" th:selected="${product.condition == 'Any'}">Any</option><option value="Slightly Used" th:selected="${product.condition == 'Slightly Used'}">Slightly Used</option></select></div><div class="field"><label for="description">Description</label><textarea id="description" th:field="*{description}" required></textarea></div></div><div class="actions"><a class="secondary" href="/products">Cancel</a><button class="primary" type="submit">Save Changes</button></div></form></main></body></html>
