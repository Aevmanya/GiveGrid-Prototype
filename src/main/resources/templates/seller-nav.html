<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="seller-nav">
<link rel="stylesheet" th:href="@{/css/givegrid-theme.css}">
<style>
.org-topbar{background:rgba(255,255,255,.97);border-bottom:1px solid #dfe8f1;position:sticky;top:0;z-index:1000;backdrop-filter:blur(12px)}
.org-topbar-inner{max-width:1240px;min-height:72px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.org-brand{color:#18324a;text-decoration:none;font-size:25px;font-weight:800;letter-spacing:-.6px}.org-mark{display:inline-flex;width:34px;height:34px;margin-right:8px;border-radius:10px;align-items:center;justify-content:center;background:#eaf4ff;color:#2f80ed;font-weight:800}
.org-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.org-nav a{color:#53697d;text-decoration:none;font-size:14px;font-weight:650;padding:9px 12px;border-radius:9px}.org-nav a:hover{background:#edf5fa;color:#18324a}.org-nav .account{border:1px solid #b9d9fb;color:#2f80ed;background:#fff}
@media(max-width:760px){.org-topbar-inner{padding:12px 16px;align-items:flex-start}.org-nav a{padding:8px 9px}.org-brand{font-size:22px}}
</style>
<header class="org-topbar"><div class="org-topbar-inner">
<a class="org-brand" href="/seller/dashboard"><span class="org-mark">G</span>GiveGrid</a>
<nav class="org-nav" aria-label="Organisation navigation">
<a href="/seller/dashboard">Dashboard</a><a href="/products">My Requests</a><a href="/seller/requests">Donation Requests</a><a class="account" href="/profile">Account</a>
</nav></div></header>
</th:block>
