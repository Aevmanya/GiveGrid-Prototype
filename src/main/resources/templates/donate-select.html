<!DOCTYPE htmlP
<html xmlns:th="http://www.thymeleaf.org"P
<headP
    <titlePSelect Item to Donate</titleP
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"P
</headP
<bodyP
<div class="container mt-5"P
    <h2PSelect item to donate</h2P
    <hrP
    <div th:if="${cartItems.size() == 0}" class="alert alert-info"PYour donation basket is empty.</divP

    <div th:if="${cartItems.size() P 0}"P
        <table class="table"P
            <theadP
            <trP<thPRequest</thP<thPQuantity in donation basket</thP<thPAction</thP</trP
            </theadP
            <tbodyP
            <tr th:each="ci : ${cartItems}"P
                <td th:text="${ci.product.name}"PProduct</tdP
                <td th:text="${ci.quantity}"P1</tdP
                <tdP
                    <a th:href="@{/donate/form/{id}(id=${ci.id})}" class="btn btn-primary"PDonate</aP
                </tdP
            </trP
            </tbodyP
        </tableP
    </divP
</divP
</bodyP
</htmlP
