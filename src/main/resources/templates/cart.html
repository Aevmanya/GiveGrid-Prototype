<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Donation Basket</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f4f6f9
        }

        .btn-primary4 {
            display: flex;
            justify-content: center;
            background: #ff4c4c;
            color: white;
            margin-left: 8px;
            width: 220px;
            border-radius: 10px;
        }

        .form-control {
            width: 95%;
            text-align: left;
            padding: 10px 12px;
            border: 1px solid #ccc;
            font-size: 14px;
            border-radius: 40px;
        }

        .table{
            text-align: center;
        }

        .mb-4{
            text-align: center;
        }


    </style>
</head>

<body>

<!-- 🔥 EXACT HOME PAGE NAVBAR (but Add Product → Home) -->
<div th:replace="~{donor-nav :: donor-nav}"></div>

<div class="container mt-5">
    <h2 class="mb-4">Your Donation Basket</h2>

    <!-- If cart empty -->
    <div th:if="${items.size() == 0}">
        <div class="alert alert-info">
            Your donation basket is empty.
        </div>
    </div>

    <!-- If cart has items -->
    <div th:if="${items.size() > 0}" class="card p-3">

        <table class="table">
            <thead>
            <tr>
                <th>Request</th>
                <th>Quantity Required</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.quantity}"></td>

                <td class="text-center">
                    <div class="d-inline-flex gap-2">

                        <!-- VIEW PRODUCT BUTTON -->
                        <a th:href="@{'/products/' + ${item.product.id}}"
                           class="btn btn-primary btn-sm">
                            View Request
                        </a>

                        <!-- REMOVE BUTTON -->
                        <a th:href="@{'/cart/remove/' + ${item.id}}"
                           class="btn btn-danger btn-sm">
                            Remove from donation basket
                        </a>

                    </div>
                </td>

            </tr>
            </tbody>
        </table>

    </div>
</div>
<div class="text-end mt-4">
    <div class="text-end mt-4">
        <a href="/donate/select" class="btn btn-warning">Donate items</a>
    </div>
</div>

</body>
</html>
