<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Request | GiveGrid</title>
<style>
body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid #e6e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box}.brand{font-size:24px;font-weight:800;color:#172033;text-decoration:none}.nav{display:flex;gap:8px}.nav a{padding:9px 12px;border-radius:9px;text-decoration:none;color:#475467;font-size:14px;font-weight:650}.nav a:hover{background:#f2f4f7}.account{border:1px solid #bfdbfe;color:#2563eb!important}.wrap{max-width:900px;margin:0 auto;padding:48px 24px}.eyebrow{margin:0 0 8px;color:#2563eb;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:40px;letter-spacing:-1.4px}.intro{color:#667085;line-height:1.6;margin:12px 0 28px}.card{background:#fff;border:1px solid #e6e9ef;border-radius:18px;padding:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px}.full{grid-column:1/-1}label{font-size:13px;font-weight:750}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}textarea{min-height:130px;resize:vertical}.actions{margin-top:24px;padding-top:20px;border-top:1px solid #e6e9ef;display:flex;gap:10px}.btn{padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:750;border:0;font:inherit;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#fff;border:1px solid #d0d5dd;color:#475467}@media(max-width:700px){.top{height:auto;min-height:72px;align-items:flex-start;padding:14px 16px;gap:12px}.nav{flex-wrap:wrap}.wrap{padding:34px 16px}.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:34px}}
</style></head>
<body>
<header class="top"><a class="brand" href="/seller/dashboard">GiveGrid</a><nav class="nav"><a href="/seller/dashboard">Dashboard</a><a href="/products">My Requests</a><a href="/seller/requests">Donation Requests</a><a href="/seller/donation/history">Donation History</a><a class="account" href="/profile">Account</a></nav></header>
<main class="wrap"><p class="eyebrow">Organisation workspace</p><h1>Create a request</h1><p class="intro">Tell donors what your organisation needs, how many items are required, and what condition is acceptable.</p>
<form class="card" action="/products/add" method="post">
<div class="grid">
<div class="field"><label for="name">Request name</label><input id="name" name="name" type="text" placeholder="e.g. School notebooks" required></div>
<div class="field"><label for="quantity">Quantity required</label><input id="quantity" name="quantity" type="number" min="1" required></div>
<div class="field"><label for="condition">Request condition</label><select id="condition" name="condition" required><option value="New">New</option><option value="Used">Used</option><option value="Any">Any</option><option value="Slightly Used">Slightly Used</option></select></div>
<div class="field"><label for="description">Description</label><textarea id="description" name="description" placeholder="Explain what these items will help with." required></textarea></div>
</div>
<div class="actions"><a class="btn secondary" href="/seller/dashboard">Cancel</a><button class="btn primary" type="submit">Create Request</button></div>
</form></main></body></html>
