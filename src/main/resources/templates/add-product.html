<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Request | GiveGrid"><style>
:root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#f4f7fb);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{max-width:900px;margin:auto;padding:46px 24px 64px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}h1{font-size:40px;letter-spacing:-1.4px;margin:0}.intro{color:var(--muted);line-height:1.6;margin:12px 0 28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 5px 18px #1018280a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:11px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:140px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:#93b4ff;box-shadow:0 0 0 4px #eff6ff}.actions{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:22px}.primary,.secondary{padding:11px 16px;border-radius:10px;font:inherit;font-weight:750;text-decoration:none}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid #d0d5dd;color:#475467;background:#fff}@media(max-width:700px){.shell{padding:34px 16px}.grid{grid-template-columns:1fr}h1{font-size:34px}.card{padding:22px}}
</style></head><body><div th:replace="~{seller-nav :: seller-nav}"></div><main class="shell"><p class="eyebrow">Organisation workspace</p><h1>Create a request</h1><p class="intro">Tell donors what your organisation needs, how many items are required, and what condition is acceptable.</p><form class="card" th:action="@{/products/add}" th:object="${product}" method="post"><div class="grid"><div class="field"><label for="name">Request name</label><input id="name" type="text" th:field="*{name}" placeholder="e.g. School notebooks" required></div><div class="field"><label for="quantity">Quantity required</label><input id="quantity" type="number" th:field="*{quantity}" min="1" required></div><div class="field"><label for="condition">Request condition</label><select id="condition" name="condition" required><option value="New">New</option><option value="Used">Used</option><option value="Any">Any</option><option value="Slightly Used">Slightly Used</option></select></div><div class="field"><label for="description">Description</label><textarea id="description" th:field="*{description}" placeholder="Explain what these items will help with." required></textarea></div></div><div class="actions"><a class="secondary" href="/seller/dashboard">Cancel</a><button class="primary" type="submit">Create Request</button></div></form></main></body></html>
